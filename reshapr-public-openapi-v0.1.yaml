---
openapi: 3.0.2
info:
  title: reShapr Public API v0.1
  version: 0.0.1
  description: reShapr control plane REST API
  contact:
    name: Laurent Broudoux
    url: https://github.com/lbroudoux
    email: laurent.broudoux@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
paths:
  /v1/artifacts:
    post:
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  description: The specification file to import as an artifact
                  type: string
                  format: binary
                mainArtifact:
                  description: Whether this artifact is a primary one (default is true)
                  type: boolean
                  default: true
                serviceName:
                  description: Name to assign to the imported Service (overrides the one from the specification)
                  type: string
                serviceVersion:
                  description: Version to assign to the imported Service (overrides the one from the specification)
                  type: string
                includedOperations:
                  description: List of operation names to include from the specification
                  type: array
                  items:
                    type: string
                excludedOperations:
                  description: List of operation names to exclude from the specification
                  type: array
                  items:
                    type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  description: The remote URL of the specification to import as an artifact
                  type: string
                mainArtifact:
                  description: Whether this artifact is a primary one (default is true)
                  type: boolean
                  default: true
                secretName:
                  description: Name of the Secret to use for authenticating the remote URL fetch
                  type: string
                serviceName:
                  description: Name to assign to the imported Service (overrides the one from the specification)
                  type: string
                serviceVersion:
                  description: Version to assign to the imported Service (overrides the one from the specification)
                  type: string
                includedOperations:
                  description: List of operation names to include from the specification
                  type: array
                  items:
                    type: string
                excludedOperations:
                  description: List of operation names to exclude from the specification
                  type: array
                  items:
                    type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: Artifact imported
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: >-
            The artifact could not be imported. The response body contains a message describing the
            validation error (e.g. invalid or malformed specification file, unresolvable remote URL).
      security:
      - jwt-bearer: []
      operationId: importArtifact
  /v1/artifacts/attach:
    post:
      requestBody:
        content:
          multipart/form-data: { }
          application/x-www-form-urlencoded: { }
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: Artifact attache
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: >-
            The artifact could not be attached. The response body contains a message describing the
            validation error (e.g. invalid or malformed artifact file, unresolvable remote URL).
      security:
        - jwt-bearer: [ ]
      operationId: attachArtifact
  /v1/artifacts/{id}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
          description: The artifact with matching identifier
        "404":
          description: Artifact with this id is unknown
      security:
        - jwt-bearer: [ ]
      operationId: getArtifact
    delete:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDeletionImpact'
          description: >-
            Artifact deleted. The response describes the impact of the deletion on the ConfigurationPlans
            of the service that referenced the artifact by name in their includedArtifacts selection.
        "404":
          description: Artifact with this id is unknown
      security:
        - jwt-bearer: [ ]
      operationId: deleteArtifact
    parameters:
      - name: id
        description: Unique identifier of the Artifact to manage
        schema:
          type: string
        in: path
        required: true
  /v1/artifacts/{id}/deletion-impact:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDeletionImpact'
          description: >-
            Non-mutating preview of the impact of deleting the artifact, to back a confirmation prompt.
        "404":
          description: Artifact with this id is unknown
      security:
        - jwt-bearer: [ ]
      operationId: getArtifactDeletionImpact
    parameters:
      - name: id
        description: Unique identifier of the Artifact to manage
        schema:
          type: string
        in: path
        required: true
  /v1/artifacts/service/{serviceId}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artifact'
          description: Get the list of service artifacts
      operationId: getArtifactsByServiceId
    parameters:
      - name: serviceId
        description: Unique identifier of Service
        schema:
          type: string
        in: path
        required: true
  /v1/artifacts/service/{serviceId}/refs: { }
  /v1/configurationPlans:
    get:
      parameters:
      - name: serviceId
        description: Service unique identifier
        schema:
          type: string
        in: query
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigurationPlan'
          description: Get the list of ConfigurationPlan by service identifier
      security:
      - jwt-bearer: []
      operationId: getConfigPlans
    post:
      requestBody:
        description: The Configuration Plan to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationPlan'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationPlan'
          description: Configuration Plan is created
        "404":
          content:
            application/json:
              schema:
                type: string
          description: "One COnfiguration Plan dependency (service, secret, ...) cannot\
            \ be found"
      security:
      - jwt-bearer: []
      operationId: createConfigPlan
  /v1/configurationPlans/{id}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationPlan'
          description: The Configuration Plan matching requested id
        "404":
          description: Configuration Plan with this id is unknown
      security:
        - jwt-bearer: [ ]
      operationId: getConfigPlan
    put:
      requestBody:
        description: The updated Configuration Plan
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationPlan'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationPlan'
          description: Configuration Plan has been updated
        "404":
          description: Configuration Plan with id not found
      security:
        - jwt-bearer: [ ]
      operationId: updateConfigPlan
    delete:
      responses:
        "204":
          description: Successfully deleted
        "404":
          description: Configuration with id not found
      security:
        - jwt-bearer: [ ]
      operationId: deleteConfigPlan
    parameters:
      - name: id
        description: Configuration Plan unique identifier
        schema:
          type: string
        in: path
        required: true
  /v1/configurationPlans/{id}/renewApiKey:
    put:
      parameters:
        - name: id
          description: The Configuration Plan unique identifier
          schema:
            type: string
          in: path
          required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationPlan'
          description: The updated Configuration Plan
      operationId: renewConfigPlanApiKey
  /v1/expositions:
    get:
      parameters:
      - name: serviceId
        description: Unique identifier of the Service to get Expositions for
        schema:
          type: string
        in: query
      - name: gatewayGroupId
        description: 'Identifier of the Gateway Group to get Expositions for '
        schema:
          type: string
        in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exposition'
          description: Get the expositions - either all or filtered by Service or
            Gateway Group
      security:
      - jwt-bearer: []
      operationId: getExpositions
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpositionReference'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exposition'
          description: Exposition successfully created
        "404":
          content:
            application/json:
              schema:
                type: string
          description: One of exposition dependency (Configuration Plan or Gateway
            Group) cannot be found
        "409":
          description: Exposition already exists (either with same name or same Configuration Plan and Gateway Group)
      security:
      - jwt-bearer: []
      operationId: createExposition
  /v1/expositions/{id}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exposition'
          description: The Exposition with provided id
        "404":
          description: Exposition with this id is unknown
      security:
        - jwt-bearer: [ ]
      operationId: getExposition
    delete:
      responses:
        "204":
          description: Exposition deleted
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Exposition with this is is not found
      security:
        - jwt-bearer: [ ]
      operationId: deleteExposition
    parameters:
      - name: id
        description: Exposition unique identifier
        schema:
          type: string
        in: path
        required: true
  /v1/expositions/active:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveExposition'
          description: The list of active Expositions
      security:
        - jwt-bearer: []
      operationId: getActiveExpositions
  /v1/expositions/active/{id}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveExposition'
          description: The active exposition with provided id
        "404":
          description: Exposition with this id is unknown
      security:
        - jwt-bearer: [ ]
      operationId: getActiveExposition
    parameters:
      - name: id
        description: The unique identifier of the active Exposition to manage
        schema:
          type: string
        in: path
        required: true
  /v1/gatewayGroups:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatewayGroup'
          description: The available GatewayGroups
      security:
      - jwt-bearer: []
      operationId: listGatewayGroups
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayGroup'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayGroup'
          description: The created GatewayGroup
        "429":
          description: Quotas of GatewayGroups exceeded
      security:
      - jwt-bearer: []
      operationId: createGatewayGroup
  /v1/gatewayGroups/{id}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayGroup'
          description: The GatewayGroupd with provided id
      security:
        - jwt-bearer: [ ]
      operationId: getGatewayGroup
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayGroup'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayGroup'
          description: The updated GatewayGroup
        "404":
          description: GatewayGroup with id is unknown
      security:
        - jwt-bearer: [ ]
      operationId: updateGatewayGroup
    delete:
      responses:
        "204":
          description: GatewayGroup succesfully removed
        "404":
          description: GatewayGroup with is is unknwon
      security:
        - jwt-bearer: [ ]
      operationId: deleteGateGroup
    parameters:
      - name: id
        description: The unique identifier of GatewayGroup to manage
        schema:
          type: string
        in: path
        required: true
  /v1/quotas:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quota'
          description: Get the quotas of the user's organization
      security:
      - jwt-bearer: []
      operationId: getQuotas
  /v1/gateways:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatewayView'
          description: The gateways currently active in the user's organization
      security:
      - jwt-bearer: []
      operationId: listGateways
  /v1/secrets:
    get:
      parameters:
      - name: page
        description: The number of the page to fetch (default is 0)
        schema:
          type: integer
        in: query
      - name: size
        description: The number of secrets in a page to fetch (default is 20)
        schema:
          type: integer
        in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'
          description: Get the user's organization secrets
      security:
      - jwt-bearer: []
      operationId: getSecrets
    post:
      requestBody:
        description: The secret to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Secret'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          description: Secret is successfully created
        "409":
          description: Secret with this name already exists in the organization
      security:
      - jwt-bearer: []
      operationId: createSecret
  /v1/services:
    get:
      parameters:
      - name: page
        description: Number of page to fetch (default to 0)
        schema:
          type: number
        in: query
      - name: size
        description: Size of the page to fetch (default to 20)
        schema:
          type: number
        in: query
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
          description: The list of fetched Services
      security:
      - jwt-bearer: []
      operationId: getServices
  /v1/services/{id}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceView'
          description: Get the ServiceView
        "404":
          description: Service with id is unknown
      security:
      - jwt-bearer: []
      operationId: getServiceView
    delete:
      responses:
        "204":
          description: Service has been deleted
        "404":
          description: Service is unknown
      security:
      - jwt-bearer: []
      operationId: deleteService
    parameters:
    - name: id
      description: The Service unique identifier
      schema:
        type: string
      in: path
      required: true
  /v1/secrets/{id}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          description: The secret with matching identifier
      operationId: getSecret
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Secret'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
          description: The updated secret
      security:
      - jwt-bearer: []
      operationId: updateSecret
    delete:
      responses:
        "204":
          description: Secret has been removed
        "404":
          description: Secret with this id is unknown
      security:
      - jwt-bearer: []
      operationId: deleteSecret
    parameters:
    - name: id
      description: The unique identifier of the Secret to manage
      schema:
        type: string
      in: path
      required: true
  /v1/tokens/apiTokens:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
          description: The list of ApiTokens for this organization
      security:
      - jwt-bearer: []
      operationId: getApiTokens
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
          description: The newmly created ApiToken
      security:
      - jwt-bearer: []
      operationId: createApiToken
  /v1/tokens/apiTokens/{id}:
    delete:
      responses:
        "204":
          description: ApiToken has been successfully removed
        "404":
          description: ApiToken with this id is unknown
      operationId: deleteApiToken
      security:
        - jwt-bearer: []
    parameters:
    - name: id
      description: The unique identifier of ApiToken to manage
      schema:
        type: string
      in: path
      required: true
  /v1/user/profile:
    get:
      operationId: getUserProfile
      summary: Get the current authenticated user profile
      responses:
        "200":
          description: The current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
      security:
        - jwt-bearer: []
  /v1/user/profile/defaultOrganization:
    put:
      operationId: updateDefaultOrganization
      summary: Update the default organization of the current authenticated user
      requestBody:
        description: The new default organization identifier
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: The updated user profile with the new default organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "404":
          description: User with this name is unknown
      security:
        - jwt-bearer: []
  /v1/organizations/{organizationName}/members:
    get:
      operationId: getOrganizationMembers
      summary: Get the members of an organization
      description: Returns the list of members belonging to the specified organization. Only the organization owner is allowed to view members.
      parameters:
        - name: organizationName
          in: path
          required: true
          schema:
            type: string
          description: The name of the organization
      responses:
        "200":
          description: The list of organization members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        "403":
          description: Only the owner can view members
        "404":
          description: Organization not found
      security:
        - jwt-bearer: []
    post:
      operationId: addOrganizationMember
      summary: Add a member to an organization
      description: Adds a user (identified by email) as a member of the specified organization. Only the organization owner is allowed to add members.
      parameters:
        - name: organizationName
          in: path
          required: true
          schema:
            type: string
          description: The name of the organization
      requestBody:
        description: The member to add
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRequest'
        required: true
      responses:
        "200":
          description: User added as a member
          content:
            application/json:
              schema:
                type: string
        "400":
          description: The email address does not match any existing user account
        "403":
          description: Only the owner can add members
        "404":
          description: Organization not found
      security:
        - jwt-bearer: []
  /v1/organizations/{organizationName}/members/{email}:
    delete:
      operationId: removeOrganizationMember
      summary: Remove a member from an organization
      description: Removes a user (identified by email) from the specified organization. Only the organization owner is allowed to remove members. The owner cannot be removed.
      parameters:
        - name: organizationName
          in: path
          required: true
          schema:
            type: string
          description: The name of the organization
        - name: email
          in: path
          required: true
          schema:
            type: string
          description: The email of the member to remove
      responses:
        "204":
          description: Member successfully removed
        "400":
          description: Cannot remove the owner of the organization
        "403":
          description: Only the owner can remove members
        "404":
          description: Organization or user not found
      security:
        - jwt-bearer: []
components:
  schemas:
    Error:
      description: A structured error payload returned when a request cannot be fulfilled
      required:
      - message
      type: object
      properties:
        message:
          description: A human-readable description of the error
          type: string
    Artifact:
      description: An Artifact in reShapr control plane
      required:
      - id
      - organizationId
      - name
      - content
      - mainArtifact
      - type
      - sourceArtifact
      type: object
      properties:
        id:
          description: Artifact unique identifier
          type: string
        organizationId:
          description: Identifier of the owning organization
          type: string
        name:
          description: Artifact name
          type: string
        content:
          description: Artifact content
          type: string
        path:
          description: Relative path from root Artifact
          type: string
        mainArtifact:
          description: Whether this artifact is a primary one
          type: boolean
        type:
          $ref: '#/components/schemas/ArtifactType'
          description: The type of this Artifact
        sourceArtifact:
          description: Name or URL of original artifact file
          type: string
        capabilities:
          description: >-
            Names of the capabilities declared by a custom artifact (prompt names, resource/
            resourceTemplate uris, custom tool names or filters).
          type: array
          items:
            type: string
    ArtifactDeletionImpact:
      description: >-
        Impact of deleting an artifact on the ConfigurationPlans of its service. Returned as a preview by
        GET /v1/artifacts/{id}/deletion-impact and as the applied result by DELETE /v1/artifacts/{id}.
      required:
        - artifactId
        - artifactName
        - mainArtifact
        - impactedPlans
      type: object
      properties:
        artifactId:
          description: Identifier of the artifact
          type: string
        artifactName:
          description: Name of the artifact
          type: string
        mainArtifact:
          description: Whether the artifact is the service main artifact
          type: boolean
        impactedPlans:
          description: ConfigurationPlans referencing the artifact by name in their includedArtifacts
          type: array
          items:
            $ref: '#/components/schemas/ImpactedConfigurationPlan'
    ImpactedConfigurationPlan:
      description: A ConfigurationPlan impacted by an artifact deletion
      required:
        - id
        - name
        - fallsBackToAll
      type: object
      properties:
        id:
          description: Identifier of the ConfigurationPlan
          type: string
        name:
          description: Name of the ConfigurationPlan
          type: string
        fallsBackToAll:
          description: >-
            Whether removing the artifact empties the plan selection, making it fall back to all attached
            artifacts of the service
          type: boolean
    ArtifactType:
      description: The supported type of Artifact
      enum:
      - JSON_SCHEMA
      - OPEN_API_SPEC
      - GRAPHQL_SCHEMA
      - PROTOBUF_SCHEMA
      - PROTOBUF_DESCRIPTOR
      - JSON_FRAGMENT
      - RESHAPR_PROMPTS
      - RESHAPR_CUSTOM_TOOLS
      - RESHAPR_RESOURCES
      type: string
    ArtifactReference:
      description: Basic information about an Artifact in reShapr control plane
      required:
      - id
      - organizationId
      - name
      - mainArtifact
      - type
      - sourceArtifact
      type: object
      properties:
        id:
          description: Artifact unique identifier
          type: string
        organizationId:
          description: Identifier of the owning organization
          type: string
        name:
          description: Artifact name
          type: string
        path:
          description: Relative path from root Artifact
          type: string
        mainArtifact:
          description: Whether this artifact is a primary one
          type: boolean
        type:
          $ref: '#/components/schemas/ArtifactType'
          description: The type of this Artifact
        sourceArtifact:
          description: Name or URL of original artifact file
          type: string
        capabilities:
          description: >-
            Names of the capabilities declared by a custom artifact (prompt names, resource/
            resourceTemplate uris, custom tool names or filtereds).
          type: array
          items:
            type: string
    ConfigurationPlanSummary:
      description: The summary of a ConfigurationPlan in reShapr control plane
      required:
      - id
      - backendEndpoint
      type: object
      properties:
        id:
          description: Unique identifier of the ConfigurationPlan
          type: string
        backendEndpoint:
          description: The backend endpoint of this Configuration Plan
          type: string
    SecretReference:
      description: A reference to a Secret of reShapr control plane
      type: object
    SecretType:
      description: The types of Secret available in reShapr
      enum:
      - ARTIFACT
      - ENDPOINT
      type: string
    SecretAuthMethod:
      description: >-
        The explicit authentication method a Secret carries when used to authenticate against a backend endpoint.
        Used as the dispatch discriminator by the proxy. The list is extensible: new methods may be added over time.
      enum:
      - BASIC
      - BEARER_TOKEN
      - OAUTH2_AUTHORIZATION_CODE
      - OAUTH2_CLIENT_CREDENTIALS
      type: string
    ServiceView:
      description: An aggregated view no Service and related elements in reShapr
      required:
      - id
      - organizationId
      - name
      - version
      - createdOn
      - type
      type: object
      properties:
        id:
          description: Service unique identifier
          type: string
        organizationId:
          description: Identifier of the owning organization
          type: string
        name:
          description: Service name
          type: string
        version:
          description: Service version
          type: string
        createdOn:
          format: date-time
          description: Creation date in control plane
          type: string
        type:
          $ref: '#/components/schemas/ServiceType'
          description: Service type
        operations:
          description: The list of operations exposed by this service
          type: array
          items:
            $ref: '#/components/schemas/Operation'
    ServiceSummary:
      description: Basic information of a Service in reShapr control plane
      required:
      - id
      - name
      - version
      - type
      type: object
      properties:
        id:
          description: Service unique identifier
          type: string
        name:
          description: Service name
          type: string
        version:
          description: Service version
          type: string
        type:
          $ref: '#/components/schemas/ServiceType'
          description: Service type
    ServiceType:
      description: The available types of Service in reShapr
      enum:
      - REST
      - GRAPHQL
      - GRPC
      type: string
    ValidityPeriod:
      description: 'The available duration that representation a validity period in reShapr'
      enum:
      - "1"
      - "7"
      - "30"
      - "90"
      type: string
    Exposition:
      description: An Exposition in reShapr control plane
      required:
      - id
      - organizationId
      type: object
      properties:
        id:
          description: Unique identifier of the Exposition
          type: string
        organizationId:
          description: Unique identifier of the organization owning the Exposition
          type: string
        name:
          description: Optional organization-unique name of the Exposition (absent when unnamed)
          type: string
        createdOn:
          format: date-time
          description: Creation date in control plane
          type: string
        gatewayGroup:
          $ref: '#/components/schemas/GatewayGroup'
          description: The gateway group the service is exposed on
        configurationPlan:
          $ref: '#/components/schemas/ConfigurationPlan'
          description: The configuration plan used for this exposition
        service:
          $ref: '#/components/schemas/Service'
          description: The service being exposed
    ExpositionReference:
      description: A reference to an Exposition in reShapr control plane
      required:
      - id
      - organizationId
      type: object
      properties:
        id:
          description: Unique identifier of the Exposition
          type: string
        organizationId:
          description: Unique identifier of the organization owning the Exposition
          type: string
        name:
          description: Optional organization-unique name of the Exposition. When omitted at creation,
            the Exposition is created unnamed (a default slug may be proposed by the CLI/Web UI).
          type: string
        createdOn:
          format: date-time
          description: Creation date in control plane
          type: string
        gatewayGroupId:
          description: Identifier of the gateway group the service is exposed on
          type: string
        configurationPlanId:
          description: Identifier of the configuration plan used for this exposition
          type: string
    Operation:
      description: A Service Operation in reShapr control plane
      required:
      - name
      type: object
      properties:
        name:
          description: Name of the operation
          type: string
        method:
          description: HTTP or protocol specification method if it makes sense
          type: string
        action:
          description: Denoted operation action (depending on the protocol)
          type: string
        intputName:
          description: Name of input message type
          type: string
        outputName:
          description: Name of output message type
          type: string
    Service:
      description: A Service in reShapr control plane
      required:
      - id
      - organizationId
      - name
      - version
      - createdOn
      - type
      type: object
      properties:
        id:
          description: Service unique identifier
          type: string
        organizationId:
          description: Identifier of the owning organization
          type: string
        name:
          description: Service name
          type: string
        version:
          description: Service name
          type: string
        type:
          $ref: '#/components/schemas/ServiceType'
          description: Service type
        createdOn:
          format: date-time
          description: Creation date in control plance
          type: string
    ConfigurationPlan:
      description: A ConfigurationPlan in reShapr control plane
      required:
      - id
      - organizationId
      - backendEndpoint
      - name
      - serviceId
      type: object
      properties:
        id:
          description: Unique identifier of the ConfigurationPlan
          type: string
        organizationId:
          description: Identifier of the owning organization
          type: string
        backendEndpoint:
          description: The backend endpoint of this Configuration Plan
          type: string
        name:
          description: Name of the Configuration Plan
          type: string
        serviceId:
          description: Identifier of the Service this Configuration Plan relates to
          type: string
        excludedOperations:
          description: List of excluded operation names
          type: array
          items:
            type: string
        includedOperatoions:
          description: List of included operation names
          type: array
          items:
            type: string
        includedArtifacts:
          description: List of selected attached artifact names. Empty (or absent) means all the
            attached artifacts of the service apply. The service main artifact is never impacted.
          type: array
          items:
            type: string
        backendSecretId:
          description: Identifier of Backend Secret to use if any
          type: string
        apiKey:
          description: The MCP endpoint API Key if configured
          type: string
        initialAccessToken:
          description: Initial Access Token if using th einternal identity provider
            for OAuth2 DCR
          type: string
        backendTimeout:
          description: Timeout in milliseconds for requests to the backend endpoint
          type: integer
        audit:
          description: Whether the audit log will be enabled and calls logged. Default is false.
          type: boolean
        cachePolicy:
          $ref: '#/components/schemas/CachePolicy'
          description: Caching configuration for this Configuration Plan. When absent the
            proxy falls back to its built-in defaults.
    CachePolicy:
      description: Caching configuration of a Configuration Plan. Both fields are optional;
        when absent the proxy falls back to its built-in defaults.
      type: object
      properties:
        ttlMs:
          format: int64
          description: Time-to-live in milliseconds for client-side MCP caching
          type: integer
        cacheScope:
          description: Cache scope to advertise (e.g. "public" or "private")
          type: string
    ActiveExposition:
      description: An Exposition that is currently active. ie. exposed by at least
        one Gateway
      required:
      - service
      - configurationPlan
      - gateways
      - id
      - organizationId
      type: object
      properties:
        service:
          $ref: '#/components/schemas/ServiceView'
          description: ""
        configurationPlan:
          $ref: '#/components/schemas/ConfigurationPlanSummary'
          description: ""
        gateways:
          description: ""
          type: array
          items:
            $ref: '#/components/schemas/GatewayView'
        id:
          description: Unique identifier of the Exposition
          type: string
        organizationId:
          description: Unique identifier of the organization of the Exposition
          type: string
        name:
          description: Optional organization-unique name of the Exposition (absent when unnamed)
          type: string
        createdOn:
          format: date-time
          description: Creation date in control plane
          type: string
    ConfigurationPlanView:
      description: Minimal representation of a Configuration Plan
      required:
      - id
      - backendEndpoint
      type: object
      properties:
        id:
          description: ""
          type: string
        backendEndpoint:
          description: ""
          type: string
    Gateway:
      description: Minimalist representation of a Gateway
      required:
      - id
      - name
      - fqdns
      type: object
      properties:
        id:
          description: The unique identifier of this gateway
          type: string
        name:
          description: The unique name of this gateway
          type: string
        fqdns:
          description: The list of Fully Qualified Domain Names of this gateway
          type: array
          items:
            type: string
    Quota:
      description: A Quota in control plance
      required:
      - id
      - organizationId
      - metric
      - enabled
      - limit
      - remaining
      type: object
      properties:
        id:
          description: Unique identifier of the quota
          type: string
        organizationId:
          description: Identifier of the organization owning this quota
          type: string
        metric:
          description: The metric subject to quota
          type: string
        enabled:
          description: Whether quota is enabled for this metric
          type: boolean
        limit:
          format: int64
          description: The maximum number of instance of this metric that is allowed
          type: integer
        remaining:
          format: int64
          description: The remanining intance of metric within this quota
          type: integer
    Secret:
      description: >-
        A Secret in the control plane. Holds the credentials used to authenticate
        against a backend endpoint (type ENDPOINT) or an artifact source (type ARTIFACT).
        The authentication mechanism is described by the optional authMethod discriminator
        (e.g. OAUTH2_CLIENT_CREDENTIALS for machine-to-machine backend authentication).
        When authMethod is absent, the mechanism is inferred from the populated fields
        (token, username/password, oauth2ClientConfiguration) for backward compatibility.
      required:
      - organizationId
      - name
      - type
      type: object
      properties:
        id:
          description: Unique identifier of this secret
        organizationId:
          description: Unique identifier or the owning organization
          type: string
        name:
          description: The name of this secret
          type: string
        description:
          description: A longer description of this secret
          type: string
        type:
          $ref: '#/components/schemas/SecretType'
          description: The type of this secret
        authMethod:
          $ref: '#/components/schemas/SecretAuthMethod'
          description: >-
            The explicit authentication method this secret carries. When set to OAUTH2_CLIENT_CREDENTIALS, the proxy
            obtains an access token on its own behalf from the oauth2ClientConfiguration token endpoint (no elicitation).
        username:
          description: Username for this secret
          type: string
        password:
          description: Password for this secret
          type: string
        token:
          description: THe token to use for this secret
          type: string
        tokenHeader:
          description: The header to use to transfer the token
          type: string
        certPem:
          description: A X509 certification in PEM format for this secret
          type: string
        useElicitation:
          description: >-
            Whether this is an elicitation based secret, i.e. the credentials are requested from the end user at 
            runtime. False for static and machine-to-machine (Client Credentials) secrets.
          type: boolean
        oauth2ClientConfiguration:
          $ref: '#/components/schemas/OAuth2ClientConfiguration'
          description: >-
            OAuth2 client configuration, used both for interactive Authorization Code (with elicitation) and 
            for machine-to-machine Client Credentials (authMethod OAUTH2_CLIENT_CREDENTIALS, without elicitation).
    OAuth2ClientConfiguration:
      description: >-
        The configuration of an OAuth2 client, used either for the Authorization Code
        flow (with elicitation) or the Client Credentials flow (machine-to-machine).
      required:
      - clientId
      - tokenEndpoint
      type: object
      properties:
        clientId:
          description: The OAuth2 client identifier
          type: string
        authorizationEndpoint:
          description: >-
            The authorization endpoint of the OAuth2 auth server. Required for the
            Authorization Code flow only; not used for Client Credentials.
          type: string
        tokenEndpoint:
          description: The token exchange endpoint of the OAuth2 authorization server
          type: string
        clientSecret:
          description: >-
            The OAuth2 client secret if needed. May reference a secret store entry
            (e.g. ${env:MY_CLIENT_SECRET}) resolved on the gateway.
          type: string
        scopes:
          description: >-
            The OAuth2 scopes to request, mainly for the Client Credentials flow.
          type: array
          items:
            type: string
    GatewayGroup:
      description: A GatewayGroup in Reshapr control plane
      required:
      - id
      - organizationId
      - name
      type: object
      properties:
        id:
          description: The unique identifier of this GatewayGroup
          type: string
        organizationId:
          description: The unique identifier of the organization this group is attahced
            to
          type: string
        name:
          description: The unique name of this GatewayGroup
          type: string
        labels:
          description: The labels attached to this gateway group (key=value pairs)
          type: object
          additionalProperties: true
    GatewayView:
      description: A gateway currently active and reporting health to the Reshapr control plane
      required:
      - id
      - name
      type: object
      properties:
        id:
          description: The unique identifier of this Gateway
          type: string
        organizationId:
          description: Identifier of the organization owning this gateway
          type: string
        name:
          description: The unique name of this Gateway
          type: string
        version:
          description: The version of the gateway runtime advertised during registration
          type: string
        startedAt:
          format: date-time
          description: The timestamp when this gateway was started
          type: string
        lastHeartbeat:
          format: date-time
          description: The timestamp of the last heartbeat received from this gateway
          type: string
        fqdns:
          description: The list of fully-qualified domain names served by this gateway
          type: array
          items:
            type: string
        labels:
          description: The labels advertised by this gateway during registration (key=value pairs)
          type: object
          additionalProperties: true
        gatewayGroups:
          description: The gateway groups this gateway is mapped to
          type: array
          items:
            $ref: '#/components/schemas/GatewayGroup'
    ApiToken:
      description: An API token for the Reshapr control plane
      required:
      - id
      - organizationId
      - name
      - username
      - validUntil
      type: object
      properties:
        id:
          description: The unique identifier of this ApiToken
          type: string
        organizationId:
          description: Identifier of the owning organization
          type: string
        name:
          description: Unique name of the token within organization
          type: string
        token:
          description: The token unique value itself
          type: string
        username:
          description: The name of user that actually created the ApiToken
          type: string
        validUntil:
          format: date-time
          description: Validaty date for this token
          type: string
    ApiTokenRequest:
      description: ""
      required:
      - name
      - validityDays
      type: object
      properties:
        name:
          description: The name for the new ApiToken to create
          type: string
        validityDays:
          description: THe number of days this token will be valid from today
          enum:
          - "1"
          - "7"
          - "30"
          - "90"
          type: string
    UserProfile:
      type: object
      properties:
        firstname:
          type: string
          description: The first name of the user
        lastname:
          type: string
          description: The last name of the user
        defaultOrganizationName:
          type: string
          description: The default organization name of the user
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/UserOrganization'
    UserOrganization:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the organization
        description:
          type: string
          description: The description of the organization
        icon:
          type: string
          description: The icon of the organization
    Member:
      description: A member of an organization
      type: object
      required:
        - username
        - email
      properties:
        username:
          type: string
          description: The username of the member
        email:
          type: string
          format: email
          description: The email address of the member
        firstname:
          type: string
          description: The first name of the member
        lastname:
          type: string
          description: The last name of the member
    MemberRequest:
      description: Request payload for adding a member to an organization
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: The email address of the user to add as a member
  securitySchemes:
    jwt-bearer:
      scheme: bearer
      type: http
      description: JWT Bearer acquired from reShapr Authentication API /auth endpoint
