quarkus.banner.path=banner.txt
quarkus.config.locations=version.properties

quarkus.http.host=0.0.0.0
quarkus.http.port=5555
quarkus.http.cors=true
quarkus.http.auth.proactive=false
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json
quarkus.http.limits.max-body-size=10M
quarkus.grpc.server.use-separate-server=false

# Logging levels
quarkus.log.level=INFO
%dev.quarkus.log.console.level=DEBUG
%dev.quarkus.log.category."io.reshapr.ctrl".level=DEBUG
quarkus.log.category."com.hazelcast.system.logo".level=OFF
# Silence the Sass "@import rules are deprecated" warnings emitted by esbuild/sass-plugin when the
# web-bundler compiles Bootstrap's SCSS. These come from Bootstrap's own sources, not ours. Genuine
# esbuild build failures are still surfaced since they are logged at ERROR level.
quarkus.log.category."io.mvnpm.esbuild.deno.ScriptLog".level=ERROR
%test.quarkus.log.category."io.mvnpm.esbuild.deno.ScriptLog".level=ERROR

# JSON serialization configuration.
quarkus.jackson.serialization-inclusion=non-null

# Database + dev service config.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.port=63663

# Hibernate configuration.
quarkus.hibernate-orm.multitenant=DISCRIMINATOR
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.database.generation=none

# Run Flyway migrations automatically
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.locations=db/migration,db/data,db/dev-data
%dev.quarkus.flyway.clean-at-start=true

# Do not load db/dev-data migrations in production, as they contain dev data.
%prod.quarkus.flyway.locations=db/migration,db/data

# JWT configuration for issuing and verifying tokens.
smallrye.jwt.new-token.issuer=https://app.reshapr.io
smallrye.jwt.time-to-live=7200
mp.jwt.verify.issuer=https://app.reshapr.io
mp.jwt.verify.token.age=7200

# TODO: must be changed before going live.
%prod.smallrye.jwt.sign.key.location=keys/jwt-rs256.pem
%prod.mp.jwt.verify.publickey.location=keys/jwt-rs256.pub.pem

# Web Bundler configuration.
quarkus.web-bundler.bundle.app=true
quarkus.web-bundler.bundle.app.key=main
quarkus.web-bundler.bundle.app.qute-tags=true
quarkus.web-bundler.dependencies.auto-import=all

# Reshapr commons configuration.
graphql.parser.max-characters=100000000
graphql.parser.max-tokens=100000


# Reshapr specific configuration.
# ------------------------------
# Application mode, can be either "on-premises" or "saas".
reshapr.mode=on-premises
reshapr.ctrl.public-url=${RESHAPR_CTRL_PUBLIC_URL:http://localhost:5555}

# When application in "on-premises", we can define an external IDP for user authentication.
reshapr.authentication.idp.enabled=false
reshapr.authentication.idp.url=http://localhost:8888/realms/3rdparty/protocol/openid-connect/auth
reshapr.authentication.idp.token-url=http://localhost:8888/realms/3rdparty/protocol/openid-connect/token
reshapr.authentication.idp.client-id=reshapr-ctrl
reshapr.authentication.idp.client-secret=my-3rdparty-idp-client-secret

# Optional additional OAuth2 scopes appended to the built-in `openid profile email`.
#reshapr.authentication.idp.scopes=my-scope-1,my-scope-2

# Optional IDP access guard: only allow users whose JWT satisfies these constraints.
# Uncomment to restrict access to a specific IDP group (standard JWT `groups` claim).
#reshapr.authentication.idp.guard-access.group=reshapr-allowed
# Uncomment to restrict access based on a claim `name=value` expression.
#reshapr.authentication.idp.guard-access.claim=reshaprAllowed=true

# Optional default organization: skip onboarding and attach the user to an existing organization.
# Resolution order (first match wins): claim > group-prefix > value.
#reshapr.authentication.idp.default-organization.claim=reshaprOrg
#reshapr.authentication.idp.default-organization.group-prefix=reshapr-org
#reshapr.authentication.idp.default-organization.value=default

# Onboarding configuration when registering users from idp.
resharp.ctrl.onboarding-quotas."gateway.count"=0
resharp.ctrl.onboarding-quotas."gateway-group.count"=0
resharp.ctrl.onboarding-quotas."exposition.count"=10

