apiVersion: reshapr.io/v1alpha1
kind: Resources
service:
  name: Repository Service
  version: '1.0.0'
resources:
  'ui://repo/dashboard':
    name: dashboard
    remoteContent: https://ui.internal.example/dashboard.html
    remoteSecret: docs-token
  'ui://repo/about':
    name: about
    remoteContent: https://ui.internal.example/about.html
    remoteSecret: docs-token
  'ui://repo/public':
    name: public
    remoteContent: https://ui.example.com/public.html
resourceTemplates:
  'ui://repo/files/{path}':
    name: file-viewer
    remoteContent: https://ui.internal.example/viewer.html
    remoteSecret: template-token

