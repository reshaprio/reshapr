services:
  web-ui:
    image: registry.reshapr.io/reshapr/reshapr-ui:nightly
    container_name: reshapr-web-ui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3333:3333"
    environment:
      - RESHAPR_CTRL_URL=http://control-plane:5555
      # The reshapr control plane API key, e.g. "my-api-key"
      - RESHAPR_ADMIN_API_KEY=CzBuQ9B0i8qrUQe6WLiDLqR3gv4iCbxvjTJQP0z0CFGQbjgBHPZSusa9d1gZKwwjdoCsJ8ogRwRzc06GipJSjSDkFOy0BSOKvAa2EjU3As9I5UjgizTzxsJAVJIXtdo2xiXHhcry9KeJa0zRhDtGmm8WMujoXrlfj0ChlJKaHZiZsRthd4UHrWkKur9KySXpPFP21H4C0Cq6OgM1rJpvMZ7Jd2ZzeEcd5lKE4PlchHZBVEdu8jYzjQtU50fkOPoR
      # The reshapr control plane web-ui application public URL, e.g. "http://localhost:5173"
      - RESHAPR_WEBUI_PUBLIC_URL=http://localhost:5555
      # If you need to restrict access to the web-ui application, you can tune the HOST.
      # - HOST=0.0.0.0
      # Public origin as perceived by the browser to prevent CSRF protection issues.
      - ORIGIN=http://localhost:3333
      # Max request body size accepted by the SvelteKit adapter-node server.
      # Defaults to 512K, which is too small for large API specifications and makes
      # spec uploads fail with an opaque "fetch failed" error. Keep it >= the control
      # plane limit (quarkus.http.limits.max-body-size, 10M) plus multipart overhead.
      - BODY_SIZE_LIMIT=12M
      # If behind a reverse proxy that sets the X-Forwarded-Proto and X-Forwarded-Host headers, uncomment the following lines.
      # - PROTOCOL_HEADER=x-forwarded-proto
      # - HOST_HEADER=x-forwarded-host