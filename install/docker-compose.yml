# This stack runs PostgreSQL + the control-plane only. The gateway (proxy) is deployed separately
# (see start-proxy.sh for a standalone container, docker-compose-all-in-one.yml for a bundled single
# gateway, or docker-compose-cluster.yml for a local two-gateway Infinispan replication demo). A
# standalone/single gateway runs the embedded Infinispan replicated MCP state as a single-node
# ("reshapr-local") cluster by default (set in Dockerfile.jvm); multi-node clustering uses DNS_PING.
services:
  postgres:
    image: library/postgres:17-alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "54321:5432"
    volumes:
      - "~/tmp/reshapr-data:/var/lib/postgresql/data/pgdata"
    environment:
      - POSTGRES_USER=reshapr
      - POSTGRES_PASSWORD=reshapr
      - POSTGRES_DB=reshapr
      - PGDATA=/var/lib/postgresql/data/pgdata

  control-plane:
    image: registry.reshapr.io/reshapr/reshapr-ctrl:nightly
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    restart: on-failure
    ports:
      - "5555:5555"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/reshapr
      - QUARKUS_DATASOURCE_USERNAME=reshapr
      - QUARKUS_DATASOURCE_PASSWORD=reshapr
      - RESHAPR_ADMIN_NAME=admin
      - RESHAPR_ADMIN_PASSWORD=password
      - RESHAPR_ADMIN_EMAIL=reshapr@example.com
      - RESHAPR_DEFAULT_GATEWAY_TOKENS=my-super-secret-token-xyz
      # Change the encryption key to a secure 32-character string for production use.
      # This key is used to encrypt sensitive data in the control plane.
      - RESHAPR_ENCRYPTION_KEY=my-super-secret-key-32-char-long
      # Enable external OIDC ID provider authentication
      #- RESHAPR_AUTHENTICATION_IDP_ENABLED=true
      #- RESHAPR_AUTHENTICATION_IDP_URL=http://localhost:8888/realms/3rdparty/protocol/openid-connect/auth
      #- RESHAPR_AUTHENTICATION_IDP_TOKEN_URL=http://host.docker.internal:8888/realms/3rdparty/protocol/openid-connect/token
      #- RESHAPR_AUTHENTICATION_IDP_CLIENT_ID=reshapr-ctrl
      #- RESHAPR_AUTHENTICATION_IDP_CLIENT_SECRET=my-3rdparty-idp-client-secret
      # Enable debug logging for the control plane to help with troubleshooting
      #- QUARKUS_LOG_CONSOLE_LEVEL=DEBUG
      #- QUARKUS_LOG_CATEGORY__IO_RESHAPR_CTRL__LEVEL=DEBUG
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5555/q/health/ready" ]
      start_period: 5s
      interval: 5s
      timeout: 2s
      retries: 3