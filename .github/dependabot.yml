version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    ignore:
      # Managed centrally in reshaprio/.github and replicated here; update there instead.
      - dependency-name: "wow-actions/welcome"
      - dependency-name: "actions/stale"

  - package-ecosystem: docker
    directories:
      - control-plane/src/main/docker
      - proxy/src/main/docker
      - web-ui
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      default-days: 7