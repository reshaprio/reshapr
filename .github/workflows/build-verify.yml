name: build-verify-package
on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths-ignore:
      #- '.github/**'
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
  pull_request:
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - 'LICENSE'
      - '*.md'

jobs:
  main-install:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 for x64
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: maven

      - name: Build Java components
        run: mvn -B -q clean install

      - id: set-environment
        name: Set environment for branch
        run: |
          set -x
          if [[ $GITHUB_REF == 'refs/heads/main' ]]; then
            echo "IMAGE_TAG=nightly" >> "$GITHUB_ENV"
            echo "IMAGE_TAG=nightly" >> "$GITHUB_OUTPUT"
            echo "PACKAGE_IMAGE=true" >> "$GITHUB_ENV"
            echo "PACKAGE_IMAGE=true" >> "$GITHUB_OUTPUT"
          elif [[ $GITHUB_REF == "refs/tags/$GITHUB_REF_NAME" ]]; then
            echo "IMAGE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "IMAGE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "PACKAGE_IMAGE=true" >> "$GITHUB_ENV"
            echo "PACKAGE_IMAGE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PACKAGE_IMAGE=false" >> "$GITHUB_ENV"
            echo "PACKAGE_IMAGE=false" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      image-tag: ${{ steps.set-environment.outputs.IMAGE_TAG }}
      package-image: ${{ steps.set-environment.outputs.PACKAGE_IMAGE }}

  cli-lint-test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect cli/ changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: '' # force local git diff instead of the GitHub API (no extra permission needed)
          filters: |
            cli:
              - 'cli/**'

      - name: Set Node.js 22.x
        if: steps.filter.outputs.cli == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: 'npm'
          cache-dependency-path: 'cli/package-lock.json'

      - name: Install CLI dependencies
        if: steps.filter.outputs.cli == 'true'
        working-directory: cli
        run: npm ci --ignore-scripts

      - name: Lint CLI
        if: steps.filter.outputs.cli == 'true'
        working-directory: cli
        run: npm run lint

      - name: Build and test CLI
        if: steps.filter.outputs.cli == 'true'
        working-directory: cli
        run: |
          npm run build
          npm run test

  web-ui-lint-test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect web-ui/ changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: '' # force local git diff instead of the GitHub API (no extra permission needed)
          filters: |
            webui:
              - 'web-ui/**'

      - name: Set Node.js 22.x
        if: steps.filter.outputs.webui == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: 'npm'
          cache-dependency-path: 'web-ui/package-lock.json'

      - name: Install web-ui dependencies
        if: steps.filter.outputs.webui == 'true'
        working-directory: web-ui
        run: npm ci --ignore-scripts

      - name: Lint web-ui
        if: steps.filter.outputs.webui == 'true'
        working-directory: web-ui
        run: npm run lint

      - name: Build and test web-ui
        if: steps.filter.outputs.webui == 'true'
        working-directory: web-ui
        run: |
          npm run check
          npm run build

  container-images-build:
    needs:
      - main-install
      - cli-lint-test
      - web-ui-lint-test
    if: github.repository_owner == 'reshaprio' && needs.main-install.outputs.package-image == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write # needed for signing the images with GitHub OIDC Token
    uses: ./.github/workflows/build-containers.yml
    with:
      image-tag: ${{ needs.main-install.outputs.image-tag }}
    secrets: inherit

  native-container-images-build:
    needs:
      - build-install
    if: github.repository_owner == 'reshaprio' && needs.build-install.outputs.package-image == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write # needed for signing the images with GitHub OIDC Token
    uses: ./.github/workflows/build-native-containers.yml
    with:
      image-tag: ${{ needs.build-install.outputs.image-tag }}
    secrets: inherit

