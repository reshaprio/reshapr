openapi: 3.1.0
info:
  title: Query parameter serialization test
  version: 1.0.0
paths:
  /legacy:
    get:
      parameters:
        - name: filter[equals]
          in: query
          schema:
            type: string
        - name: filter_equals
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
  /products:
    get:
      parameters:
        - name: filter
          in: query
          style: deepObject
          schema:
            $ref: '#/components/schemas/ProductFilter'
        - name: labels
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
  /styles:
    get:
      parameters:
        - name: tagsFormExploded
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: tagsFormUnexploded
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: filterFormExploded
          in: query
          style: form
          explode: true
          schema:
            $ref: '#/components/schemas/SimpleFilter'
        - name: filterFormUnexploded
          in: query
          style: form
          explode: false
          schema:
            $ref: '#/components/schemas/SimpleFilter'
        - name: tagsSpace
          in: query
          style: spaceDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: tagsPipe
          in: query
          style: pipeDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
components:
  schemas:
    ProductFilter:
      type: object
      required: [equals]
      properties:
        equals:
          type: string
          enum: [shoes, bags]
        exists:
          type: boolean
    SimpleFilter:
      type: object
      properties:
        equals:
          type: string
