quarkus.banner.path=banner.txt

quarkus.http.port=7777
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.enable-compression=true
quarkus.http.limits.max-body-size=10M
quarkus.http.compress-media-types=application/json

# Logging levels
quarkus.log.level=INFO
%dev.quarkus.log.console.level=DEBUG
%dev.quarkus.log.category."io.reshapr.proxy".level=DEBUG
quarkus.log.category."org.infinispan.CLUSTER".level=WARN
quarkus.log.category."org.infinispan.LIFECYCLE".level=WARN
# Silence the Sass "@import rules are deprecated" warnings emitted by esbuild/sass-plugin when the
# web-bundler compiles Bootstrap's SCSS. These come from Bootstrap's own sources, not ours. Genuine
# esbuild build failures are still surfaced since they are logged at ERROR level.
quarkus.log.category."io.mvnpm.esbuild.deno.ScriptLog".level=ERROR

# JSON serialization configuration.
quarkus.jackson.serialization-inclusion=non-null

# gRCP clients to the exposition discovery service and the gateway health service.
quarkus.grpc.dev-mode.force-server-start=false
quarkus.grpc.clients."exposition-discovery".host=${reshapr.ctrl.host}
quarkus.grpc.clients."exposition-discovery".port=${reshapr.ctrl.port}
quarkus.grpc.clients."exposition-discovery".plain-text=${reshapr.ctrl.tls.plain-text}
quarkus.grpc.clients."gateway-health".host=${reshapr.ctrl.host}
quarkus.grpc.clients."gateway-health".port=${reshapr.ctrl.port}
quarkus.grpc.clients."gateway-health".plain-text=${reshapr.ctrl.tls.plain-text}

# OpenTelemetry configuration.
%dev.quarkus.otel.enabled=false
%otel.quarkus.otel.enabled=true
%prod.quarkus.otel.enabled=true

quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.logs.level=INFO
#quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
#quarkus.otel.exporter.otlp.protocol=http/protobuf
#quarkus.otel.exporter.otlp.headers=authorization=Bearer my_secret

quarkus.observability.enabled=false
%otel.quarkus.observability.enabled=true

# Stores configuration.
# The session-store and elicitation-store caches are now backed by embedded Infinispan
# (replicated across gateway replicas) and configured in infinispan.xml.
quarkus.infinispan-embedded.xml-config=infinispan.xml
# Transport stack selection is done via the JVM system property `reshapr.infinispan.stack`
# (interpolated in infinispan.xml by Infinispan, NOT by MicroProfile Config). For local dev it is
# set to `reshapr-local` in proxy/.mvn/jvm.config; prod/K8s passes -Dreshapr.infinispan.stack=reshapr-k8s.
# We need to enable JNDI for the Infinispan client to work in reshapr-k8s mode.
quarkus.naming.enable-jndi=true

# Web Bundler configuration.
quarkus.web-bundler.bundle.app=true
quarkus.web-bundler.bundle.app.key=main
quarkus.web-bundler.bundle.app.qute-tags=true
quarkus.web-bundler.dependencies.auto-import=all

# Native compilation configuration.
quarkus.native.resources.includes=version.properties,templates/**,web/**
quarkus.native.additional-build-args=\
    -H:IncludeLocales=en,\
    --enable-preview,\
    --initialize-at-run-time=io.reshapr.proxy.proxy.ProxyService,\
    --features=io.reshapr.proxy.NativeConfigurationFeature

# Reshapr commons configuration.
graphql.parser.max-characters=100000000
graphql.parser.max-tokens=100000


# Reshapr specific configuration.
# -------------------------------
reshapr.gateway.id=reshapr-gateway-00
reshapr.gateway.labels=env=dev;team=reshapr
reshapr.gateway.fqdns=localhost:7777

# WorkCache is a local Caffeine cache - configured here.
reshapr.gateway.mcp.cache.size=1000

# This is the API key used to access this Gateway Admin API.
reshapr.gateway.api.key=${RESHAPR_GATEWAY_API_KEY:cFtltSLYHYZ0lT1zp0S0gq1asg6mMjCUEgHqxgf8R9aUYuCCefrBM2sZZutALEYw6y4EvPaRAQpBs5bjVx2Zp0LqQrHlsz31ZzwVqSIhJDwPY0S44sbDCD5xUeFlcEPOMA4Reugd6GbtalpmUSEu96B37SgjqAaPUqzDw2YeIJuWaP7FJlPlrEg6RQLY5w2piVHXeYrTDFLihQf63IlYbHVIWsCt1LBgQFsgBQjsxXjFtJtVQluAGVlht5m061dp}

# Connect/request timeout for HTTP backend calls (in milliseconds, default: 3000)
reshapr.gateway.backend.http.default-timeout=3000
# Deadline for gRPC backend calls (in milliseconds, default: 3000)
reshapr.gateway.backend.grpc.default-timeout=3000

reshapr.ctrl.host=localhost
reshapr.ctrl.port=5555
reshapr.ctrl.token=reshapr-my-super-secret-token
reshapr.ctrl.tls.plain-text=${RESHAPR_CTRL_TLS_PLAINTEXT:true}
reshapr.version=${project.version}
reshapr.buildTimestamp=${maven.build.timestamp}

%test.maven.build.timestamp=test
