asyncapi: 3.0.0
info:
  title: Orders Events API
  version: 1.0.0
  description: Order lifecycle events on Kafka (demo for reShapr MCP Events)
servers:
  local:
    host: localhost:19092
    protocol: kafka
defaultContentType: application/json
channels:
  orderCreated:
    address: orders.created
    description: Orders created by the shop application
    messages:
      OrderCreated:
        $ref: '#/components/messages/OrderCreated'
  createOrderCommand:
    address: orders.commands.create
    description: Commands asking the order service to create an order
    messages:
      CreateOrder:
        $ref: '#/components/messages/CreateOrder'
operations:
  onOrderCreated:
    action: send
    summary: Be notified when an order is created
    channel:
      $ref: '#/channels/orderCreated'
  createOrder:
    action: receive
    summary: Ask the order service to create an order
    channel:
      $ref: '#/channels/createOrderCommand'
components:
  messages:
    OrderCreated:
      name: OrderCreated
      payload:
        type: object
        properties:
          orderId:
            type: string
          org:
            type: string
            description: Organization owning the order
          customerId:
            type: string
          amount:
            type: number
    CreateOrder:
      name: CreateOrder
      payload:
        type: object
        required: [customerId, amount]
        properties:
          customerId:
            type: string
          amount:
            type: number
          org:
            type: string
